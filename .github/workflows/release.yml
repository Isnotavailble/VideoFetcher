name: Release Built APK

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Release tag name (e.g., untagged-build)"
                required: true
                default: "untagged-build"

jobs:
    publish-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: read

        steps:
            - name: Download existing APK artifact
              uses: dawidd6/action-download-artifact@v3
              with:
                  workflow: main.yml
                  name: VideoFetcher-Split-APKs
                  path: release-apks

            - name: Create GitHub Release and Upload APK
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
                  files: release-apks/*.apk
                  generate_release_notes: true
