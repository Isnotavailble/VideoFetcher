name: Build Android APK

# This triggers the action whenever you push code to the 'main' branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Recommended stable version for Kivy/Buildozer

      - name: Install System Dependencies
        run: |
          sudo apt update
          # Install the massive list of libraries Android and Buildozer need to compile C/Python code
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev libltdl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build APK with Buildozer
        run: |
          # The 'yes' command automatically accepts the Android SDK license agreements
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFetcher-APK
          # Buildozer always spits out the compiled APK into the 'bin/' folder
          path: bin/*.apk
