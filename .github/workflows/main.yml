name: Build Kotlin APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # We reverted this back to 'gradle' instead of './gradlew'
      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: VideoFetcher-Split-APKs
          # This captures the individual arm64, armv7, and x86_64 files
          path: app/build/outputs/apk/release/*.apk
